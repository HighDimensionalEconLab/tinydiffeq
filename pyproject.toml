[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tinydiffeq"
version = "2.6.1"
description = "Tiny differentiable ODE/SDE/DAE/SDAE solvers for JAX with static shapes and composable AD"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Jesse Perla", email = "jesseperla@gmail.com" }]
keywords = [
    "ode",
    "sde",
    "differential-equations",
    "runge-kutta",
    "jax",
    "autodiff",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "jax>=0.11.2",
    "nlls-gram>=2.10.0",
]

[project.urls]
Homepage = "https://github.com/HighDimensionalEconLab/tinydiffeq"
Repository = "https://github.com/HighDimensionalEconLab/tinydiffeq"
Documentation = "https://highdimensionaleconlab.github.io/tinydiffeq/"
Issues = "https://github.com/HighDimensionalEconLab/tinydiffeq/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tinydiffeq"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
benchmark = [
    "pytest-benchmark>=5.3.0",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "scipy>=1.18.1",
]
docs = [
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.7",
]
gpu = [
    "jax[cuda13]>=0.11.2 ; sys_platform == 'linux'",
    "metaljax>=0.11.9 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
]
